<head>

  <meta name="theme-color" content="#f5f1e8">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f7f4ee;
      color: #3f3a34;
      line-height: 1.6;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font-family: inherit;
    }

    .container {
      width: min(1100px, 92%);
      margin: 0 auto;
    }

    header {
      text-align: center;
      padding: 70px 20px 55px;
      background: #eee7da;
      border-bottom: 1px solid #ddd2c2;
    }

    header h1 {
      font-size: clamp(2.4rem, 7vw, 4.5rem);
      letter-spacing: 5px;
      font-weight: 700;
      color: #4a443c;
      margin-bottom: 12px;
    }

    .tagline {
      font-size: clamp(1rem, 2.5vw, 1.25rem);
      color: #6f665b;
      margin-bottom: 12px;
    }

    .powered {
      font-size: 0.9rem;
      color: #8b8175;
    }

    section {
      padding: 55px 0;
    }

    .section-title {
      text-align: center;
      margin-bottom: 35px;
    }

    .section-title h2 {
      font-size: 2rem;
      color: #4a443c;
      margin-bottom: 8px;
    }

    .section-title p {
      color: #7b7165;
      max-width: 680px;
      margin: 0 auto;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }

    /* DIGITAL SERVICES CARD LAYOUT ONLY */
    .service-cards {
      display: grid;
      grid-template-columns: repeat(3, 300px);
      justify-content: center;
      gap: 20px;
    }

    .card {
      background: #fffdf9;
      border: 1px solid #ded5c8;
      border-radius: 18px;
      padding: 25px;
      box-shadow: 0 6px 20px rgba(76, 67, 55, 0.06);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 25px rgba(76, 67, 55, 0.1);
    }

    .card h3 {
      color: #4d463e;
      margin-bottom: 10px;
      font-size: 1.2rem;
    }

    .card p {
      color: #746b61;
      font-size: 0.95rem;
      margin-bottom: 18px;
    }

    .card-link {
      display: inline-block;
      padding: 10px 16px;
      background: #6f665b;
      color: #fff;
      border-radius: 10px;
      font-size: 0.9rem;
      transition: background 0.2s ease;
    }

    .card-link:hover {
      background: #4f4941;
    }

    .calculator {
      background: #fffdf9;
      border: 1px solid #ded5c8;
      border-radius: 18px;
      padding: 25px;
      max-width: 760px;
      margin: 0 auto;
      box-shadow: 0 6px 20px rgba(76, 67, 55, 0.06);
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 15px;
    }

    label {
      display: block;
      font-size: 0.9rem;
      color: #655d54;
      margin-bottom: 6px;
      font-weight: 600;
    }

    input,
    select {
      width: 100%;
      padding: 12px 13px;
      border: 1px solid #d7cdc0;
      border-radius: 10px;
      background: #fff;
      color: #3f3a34;
      font-size: 0.95rem;
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: #9d9181;
    }

    .button-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 18px;
    }

    .primary-btn,
    .secondary-btn {
      border: none;
      border-radius: 10px;
      padding: 11px 17px;
      cursor: pointer;
      font-size: 0.92rem;
    }

    .primary-btn {
      background: #6f665b;
      color: white;
    }

    .secondary-btn {
      background: #e7dfd3;
      color: #514a42;
    }

    .result {
      margin-top: 20px;
      padding: 17px;
      background: #f1ece4;
      border-radius: 12px;
      display: none;
    }

    .result strong {
      color: #4c463e;
    }

    .notice {
      font-size: 0.8rem;
      color: #857b70;
      margin-top: 10px;
    }

    .service-price {
      font-size: 1.05rem;
      font-weight: 700;
      color: #5b534a;
      margin-bottom: 10px;
    }

    .service-note {
      font-size: 0.82rem;
      color: #8a8177;
      margin-top: 12px;
    }

    .toggle-btn {
      width: 100%;
      text-align: left;
      border: none;
      background: #eee7dc;
      color: #514a42;
      padding: 12px 14px;
      border-radius: 10px;
      cursor: pointer;
      margin-top: 10px;
      font-weight: 600;
    }

    .toggle-content {
      display: none;
      margin-top: 12px;
      padding: 15px;
      background: #f7f3ec;
      border-radius: 10px;
      font-size: 0.88rem;
      color: #6d655b;
    }

    .toggle-content p {
      margin-bottom: 10px;
    }

    .toggle-content p:last-child {
      margin-bottom: 0;
    }

    .service-button {
      margin-top: 15px;
      display: inline-block;
      background: #6f665b;
      color: white;
      padding: 10px 15px;
      border-radius: 10px;
      font-size: 0.88rem;
    }

    .service-button:hover {
      background: #4f4941;
    }

    footer {
      text-align: center;
      padding: 35px 20px;
      background: #e9e1d5;
      color: #756c61;
      font-size: 0.85rem;
    }

    footer a {
      text-decoration: underline;
    }

    .social-follow {
      margin-bottom: 15px;
    }

    .social-icons {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
      margin-top: 10px;
    }

    .social-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: #fffdf9;
      border: 1px solid #ded5c8;
      text-decoration: none;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .social-icon:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 12px rgba(76, 67, 55, 0.12);
    }

    .social-icon svg {
      width: 22px;
      height: 22px;
      fill: #6f665b;
    }

    .social-icon:nth-child(1) svg {
      fill: #1877F2;
    }

    .social-icon:nth-child(2) svg {
      fill: #E60023;
    }

    .footer-bottom {
      margin-top: 18px;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .back-top {
      display: inline-block;
    }

    @media (max-width: 980px) {
      .service-cards {
        grid-template-columns: repeat(2, 300px);
      }
    }
