<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tabing Guhit | Work with Purpose. Live with Balance. Lead with Gratitude.</title>

<style>
:root{
  --bg:#f3f0ea;
  --card:#fdfcfa;
  --text:#3a362f;
  --muted:#75706a;
  --accent:#9c8a76;
  --accent-dark:#7c6c5a;
  --line:#e2ddd3;
  --soft:#ebe6dd;
  --success:#6c8a72;
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  background:var(--bg);
  color:var(--text);
  line-height:1.6;
}

a{
  color:inherit;
  text-decoration:none;
}

.container{
  width:min(1100px,92%);
  margin:auto;
}

header{
  padding:70px 20px 45px;
  text-align:center;
  border-bottom:1px solid var(--line);
}

.logo{
  font-size:clamp(2rem,5vw,3.5rem);
  font-weight:800;
  letter-spacing:2px;
}

.tagline{
  margin-top:10px;
  font-size:clamp(1rem,2vw,1.2rem);
  color:var(--muted);
}

.powered{
  margin-top:10px;
  font-size:.9rem;
  color:var(--accent);
  font-weight:600;
}

.intro{
  text-align:center;
  padding:45px 20px 20px;
}

.intro h2{
  margin-bottom:8px;
  font-size:clamp(1.5rem,3vw,2rem);
}

.intro p{
  max-width:700px;
  margin:auto;
  color:var(--muted);
}

section{
  padding:38px 0;
}

.section-title{
  text-align:center;
  margin-bottom:28px;
}

.section-title h2{
  margin:0 0 7px;
  font-size:clamp(1.5rem,3vw,2.2rem);
}

.section-title p{
  margin:0;
  color:var(--muted);
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:20px;
}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:18px;
  padding:26px;
  box-shadow:0 8px 25px rgba(80,65,50,.05);
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
}

.card h3{
  margin-top:0;
  font-size:1.2rem;
}

.card p{
  color:var(--muted);
}

.card ul{
  text-align:left;
  display:inline-block;
  margin:10px auto;
  padding-left:20px;
}

.card .tool{
  width:100%;
  text-align:left;
}

.btn{
  display:inline-block;
  margin-top:14px;
  padding:11px 18px;
  border-radius:10px;
  background:var(--accent);
  color:white;
  font-weight:700;
  border:none;
  cursor:pointer;
  transition:.2s ease;
}

.btn:hover{
  background:var(--accent-dark);
  transform:translateY(-1px);
}

.btn.secondary{
  background:var(--soft);
  color:var(--text);
}

.small-note{
  display:block;
  margin-top:12px;
  color:var(--muted);
  font-size:.85rem;
  width:100%;
  text-align:left;
}

.tool{
  margin-top:18px;
}

label{
  display:block;
  margin:12px 0 6px;
  font-weight:700;
  font-size:.92rem;
}

input,
select,
textarea{
  width:100%;
  padding:12px 13px;
  border:1px solid var(--line);
  border-radius:10px;
  background:white;
  color:var(--text);
  font:inherit;
}

.result{
  margin-top:16px;
  padding:16px;
  background:var(--soft);
  border-radius:12px;
  min-height:50px;
  width:100%;
  text-align:left;
}

.actions{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:10px;
  margin-top:12px;
  width:100%;
}

.success{
  color:var(--success);
  font-weight:700;
}

footer{
  margin-top:40px;
  padding:40px 20px;
  text-align:center;
  border-top:1px solid var(--line);
  color:var(--muted);
}

.social{
  text-align:center;
  padding:25px 0 10px;
}

.social a{
  margin:0 8px;
  color:var(--accent-dark);
  font-weight:700;
}

@media(max-width:600px){
  header{
    padding-top:50px;
  }

  .card{
    padding:21px;
  }

  .btn{
    width:100%;
    text-align:center;
  }
}
</style>
</head>

<body>

<header>
  <div class="container">
    <div class="logo">TABING GUHIT</div>

    <div class="tagline">
      Work with Purpose. Live with Balance. Lead with Gratitude.
    </div>

    <div class="powered">
      Powered by CathiesNest Digital
    </div>
  </div>
</header>

<main class="container">

  <div class="intro">
    <h2>A simple corner for figuring things out.</h2>

    <p>
      Find useful tools, learning opportunities, work resources,
      and gentle reminders for the journey ahead.
    </p>
  </div>

  <!-- WORK WITH PURPOSE -->
  <section>

    <div class="section-title">
      <h2>WORK WITH PURPOSE</h2>

      <p>
        Explore your strengths,
